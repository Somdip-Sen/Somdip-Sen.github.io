<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appendix — Major Projects</title>
  <meta name="description" content="All the projects with their GitHub repositories." />

  <script>
    (function () {
      try {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "ui-sans-serif", "system-ui", "-apple-system", "Segoe UI", "Roboto", "Helvetica", "Arial", "sans-serif"],
            display: ["'Instrument Serif'", "Georgia", "serif"],
            mono: ["'JetBrains Mono'", "ui-monospace", "SFMono-Regular", "Menlo", "monospace"]
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f7f8;
      --fg: #0c0d12;
      --muted: #5b5c66;
      --line: rgba(12,13,18,.08);
      --card: rgba(255,255,255,.65);
      --card-strong: rgba(255,255,255,.85);
      --accent: #6d28d9;
      --glow-a: rgba(167,139,250,.45);
      --glow-b: rgba(34,211,238,.35);
      --glow-c: rgba(232,121,249,.35);
      --card-tint: linear-gradient(to top,
        rgba(76, 29, 149, .92) 0%,
        rgba(124, 58, 237, .68) 38%,
        rgba(34, 211, 238, .22) 78%,
        rgba(34, 211, 238, .04) 100%);
      --card-tint-hover: linear-gradient(to top,
        rgba(67, 20, 145, .94) 0%,
        rgba(147, 51, 234, .72) 38%,
        rgba(34, 211, 238, .26) 78%,
        rgba(34, 211, 238, .06) 100%);
    }
    .dark {
      --bg: #07080c;
      --fg: #f5f5f7;
      --muted: #9a9ba6;
      --line: rgba(255,255,255,.08);
      --card: rgba(20,21,28,.55);
      --card-strong: rgba(20,21,28,.78);
      --accent: #c4b5fd;
      --glow-a: rgba(167,139,250,.30);
      --glow-b: rgba(34,211,238,.22);
      --glow-c: rgba(232,121,249,.22);
      --card-tint: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 45%, rgba(0,0,0,.3) 100%);
      --card-tint-hover: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 45%, rgba(0,0,0,.3) 100%);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-feature-settings: "ss01","cv11";
      -webkit-font-smoothing: antialiased;
    }

    .display { font-family: "Instrument Serif", Georgia, serif; letter-spacing: -.01em; font-weight: 400; }
    .display em { font-style: italic; color: var(--accent); }

    .kicker {
      display: inline-flex; align-items: center; gap: .55rem;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted);
    }
    .kicker::before {
      content: ""; width: 22px; height: 1px; background: currentColor; opacity: .5;
    }

    /* Mesh + texture */
    .mesh { position: fixed; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
    .mesh::before, .mesh::after, .mesh > span {
      content: ""; position: absolute; border-radius: 9999px; filter: blur(80px);
      will-change: transform;
    }
    .mesh::before {
      width: 52vw; height: 52vw; left: -10vw; top: -12vw;
      background: var(--glow-a); animation: floatA 22s ease-in-out infinite alternate;
    }
    .mesh::after {
      width: 48vw; height: 48vw; right: -14vw; top: 24vh;
      background: var(--glow-b); animation: floatB 26s ease-in-out infinite alternate;
    }
    .mesh > span {
      width: 40vw; height: 40vw; left: 30vw; bottom: -18vw;
      background: var(--glow-c); animation: floatC 30s ease-in-out infinite alternate;
    }
    @keyframes floatA { to { transform: translate3d(8vw, 6vh, 0) scale(1.1); } }
    @keyframes floatB { to { transform: translate3d(-6vw, -4vh, 0) scale(1.05); } }
    @keyframes floatC { to { transform: translate3d(-4vw, -8vh, 0) scale(.95); } }

    .texture {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background-image:
        linear-gradient(to right, var(--line) 1px, transparent 1px),
        linear-gradient(to bottom, var(--line) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
      opacity: .55;
    }

    /* Cursor spotlight */
    .spotlight {
      position: fixed; pointer-events: none; z-index: 0;
      width: 600px; height: 600px;
      left: var(--mx, 50%); top: var(--my, 50%);
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(167,139,250,.10), transparent 60%);
      transition: opacity .4s ease;
      mix-blend-mode: screen;
    }
    .dark .spotlight {
      background: radial-gradient(circle, rgba(167,139,250,.18), transparent 60%);
    }
    @media (hover: none) { .spotlight { display: none; } }

    /* Theme view-transition (circular reveal) */
    @supports (view-transition-name: root) {
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none;
        mix-blend-mode: normal;
      }
      ::view-transition-old(root) { z-index: 1; }
      ::view-transition-new(root) { z-index: 2; }
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: .5rem;
      padding: .55rem .95rem; border-radius: 9999px;
      border: 1px solid var(--line); background: var(--card);
      transition: transform .25s ease, background .25s ease, border-color .25s ease, color .25s ease;
      font-size: .85rem; backdrop-filter: blur(10px);
    }
    .btn:hover { transform: translateY(-2px); border-color: color-mix(in oklab, var(--fg) 28%, transparent); }

    /* Tag chips */
    .tag {
      padding: .4rem .8rem; border-radius: 9999px;
      border: 1px solid var(--line); background: var(--card);
      font-size: .72rem; letter-spacing: .04em;
      color: var(--muted); transition: all .25s ease;
      backdrop-filter: blur(8px);
      text-transform: lowercase;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }
    .tag:hover { color: var(--fg); border-color: color-mix(in oklab, var(--fg) 24%, transparent); }
    .tag.active {
      background: var(--fg); color: var(--bg); border-color: var(--fg);
    }

    /* Search */
    .search-shell {
      position: relative;
    }
    .search-shell input {
      width: 100%;
      padding: .75rem 2.6rem .75rem 2.6rem;
      border-radius: 14px;
      background: var(--card); backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      color: var(--fg); outline: none;
      font-size: .9rem;
      transition: border-color .25s ease, box-shadow .25s ease;
    }
    .search-shell input:focus {
      border-color: color-mix(in oklab, var(--accent) 60%, transparent);
      box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 18%, transparent);
    }
    .search-shell input::placeholder { color: var(--muted); }

    /* Cards */
    .card {
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      isolation: isolate;
      background: var(--card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--line);
      display: flex; flex-direction: column;
      transition: transform .45s cubic-bezier(.2,.7,.2,1), border-color .35s ease, box-shadow .5s ease;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; padding: 1px; border-radius: inherit;
      background: linear-gradient(140deg, rgba(167,139,250,.55), rgba(34,211,238,.45), rgba(232,121,249,.5));
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity .4s ease;
      pointer-events: none;
      z-index: 4;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 60px -24px color-mix(in oklab, var(--accent) 32%, transparent);
    }
    .card:hover::before { opacity: 1; }

    .card-media {
      position: relative;
      aspect-ratio: 16/10;
      overflow: hidden;
      background: color-mix(in oklab, var(--fg) 6%, transparent);
      border-bottom: 1px solid var(--line);
    }
    .card-media img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform .9s cubic-bezier(.2,.7,.2,1), filter .5s ease;
      filter: saturate(.92);
    }
    .card:hover .card-media img {
      transform: scale(1.1);
      filter: saturate(1.04);
    }
    /* Subtle blend at bottom of image into card body */
    .card-media::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 58%, color-mix(in oklab, var(--bg) 92%, transparent) 100%);
      pointer-events: none;
      z-index: 1;
    }

    .card-arrow {
      position: absolute; top: 10px; right: 10px; z-index: 3;
      width: 32px; height: 32px;
      display: grid; place-items: center;
      border-radius: 9999px;
      background: color-mix(in oklab, var(--bg) 78%, transparent);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      color: var(--fg);
      opacity: 0;
      transform: translate(8px, -8px) scale(.85);
      transition: opacity .35s ease, transform .45s cubic-bezier(.2,.7,.2,1);
    }
    .card:hover .card-arrow {
      opacity: 1;
      transform: translate(0, 0) scale(1);
    }

    .card-info {
      padding: 1rem 1.1rem 1.15rem;
      display: flex; flex-direction: column; gap: .4rem;
      flex: 1;
    }
    .card-title {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.3;
      color: var(--fg);
      letter-spacing: -.005em;
      transition: color .3s ease;
    }
    .card:hover .card-title { color: color-mix(in oklab, var(--accent) 70%, var(--fg)); }
    .card-desc {
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .card-tags {
      display: flex; flex-wrap: wrap; gap: .35rem;
      margin-top: .25rem;
    }
    .card-tag {
      font-size: .62rem;
      padding: .18rem .5rem;
      border-radius: 9999px;
      background: color-mix(in oklab, var(--fg) 4%, transparent);
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      letter-spacing: .04em;
      transition: color .3s ease, border-color .3s ease;
    }
    .card:hover .card-tag {
      color: var(--fg);
      border-color: color-mix(in oklab, var(--fg) 18%, transparent);
    }

    /* Theme slider */
    .theme-switch {
      position: relative; height: 28px; width: 56px; border-radius: 9999px;
      border: 1px solid var(--line); background: var(--card);
      transition: background .25s ease, border-color .25s ease;
    }
    .theme-switch:focus { outline: none; box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 28%, transparent); }
    .theme-thumb {
      position: absolute; top: 2px; left: 2px;
      width: 22px; height: 22px; border-radius: 9999px;
      background: var(--fg);
      transition: transform .35s cubic-bezier(.2,.7,.2,1);
    }
    .dark .theme-thumb { transform: translateX(28px); }
    .theme-icon { position: absolute; top: 6px; width: 16px; height: 16px; color: var(--muted); transition: opacity .25s ease; }
    .theme-icon.sun  { left: 6px; opacity: 1; }
    .theme-icon.moon { right: 6px; opacity: 0; }
    .dark .theme-icon.sun { opacity: 0; }
    .dark .theme-icon.moon { opacity: 1; }

    /* Scrollbar */
    .beauty-scroll::-webkit-scrollbar { height: 10px; }
    .beauty-scroll::-webkit-scrollbar-thumb {
      background: linear-gradient(90deg, color-mix(in oklab, var(--accent) 40%, transparent), rgba(34,211,238,.45));
      border-radius: 9999px;
    }
    .beauty-scroll { scrollbar-width: thin; }

    /* Empty state */
    .empty {
      grid-column: 1 / -1;
      padding: 4rem 1rem; text-align: center; color: var(--muted);
      border: 1px dashed var(--line); border-radius: 18px;
      background: var(--card); backdrop-filter: blur(10px);
    }

    /* Fade up — fly in from the entry direction */
    .fade-up {
      opacity: 0;
      transform: translate3d(0, 64px, 0) scale(.96);
      transition:
        opacity .85s cubic-bezier(0.16, 1, 0.3, 1),
        transform .85s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .fade-up[data-dir="up"] {
      transform: translate3d(0, -64px, 0) scale(.96);
    }
    .fade-up.in {
      opacity: 1;
      transform: translate3d(0, 0, 0) scale(1);
    }

    /* Selection */
    ::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); color: var(--fg); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important; animation-iteration-count: 1 !important;
        transition-duration: .01ms !important; scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  <script>
    /* ---------- Cursor spotlight ---------- */
    const spotlight = document.querySelector('.spotlight');
    window.addEventListener('pointermove', (e) => {
      spotlight.style.setProperty('--mx', e.clientX + 'px');
      spotlight.style.setProperty('--my', e.clientY + 'px');
    });

    /* ---------- Data ---------- */
    const PROJECTS = [
      { title: "CV Retrival Copilot", repo: "Somdip-Sen/intelligent_cv_sorter", desc: "LLM Agent · RAG", tags:["llm","rag","vector db","python", "ml", "pytorch"] },
      { title: "Lightweight Face Tracker", repo: "Somdip-Sen/Lightweight_Face_Tracker--MTP", desc: "Detector less Tracker · Autoregression", tags:["cv","mtp","python", "ml", "pytorch"] },
      { title: "MRI Tumour Detection", repo: "Somdip-Sen/MRI_tumor_detection", desc: "A100 · Recall-driven", tags:["cv","python", "ml", "pytorch"] },
      { title: "Multiplayer Tic-Tac-Toe (Android)", repo: "Somdip-Sen/multiplayerTicTacToeGame", desc: "Bluetooth · Wifi-direct · Multiplayer · Fun Project", tags:["android","tictactoe game","java"] },
      { title: "Private Chatroom", repo: "Somdip-Sen/private-chatroom", desc: "Socket Programming · LAN · Fun Project", tags:["socket programming","systems","python"]},
      { title: "Blogging website prototype", repo: "Somdip-Sen/Prototype_blogging_website_flask", desc: "Flask · Web-development · Fun Project", tags:["flask", "python"] },
      { title: "Portfolio Website", repo: "Somdip-Sen/Somdip-Sen.github.io", desc: "Static site · GitHub Pages", tags:["web"] },
      { title: "GUI Game (Space Intruder)", repo: "Somdip-Sen/Space_intruder", desc: "Pygames · GUI · Fun Project", tags:["pygames","python", "gui"] },
      { title: "Employee Management webapp", repo: "Somdip-Sen/Employee_management_webapp", desc: "webapp · Python", tags:["python", "webapp", "gui"] },
      { title: "Tourist Management Windows App", repo: "Somdip-Sen/Tourist_Management_System", desc: "windows app · VB.net", tags:["webapp","vb.net", "gui"] },
    ];

    /* ---------- Helpers ---------- */
    const el = (t, cls, attrs = {}) => {
      const n = document.createElement(t);
      if (cls) n.className = cls;
      for (const [k, v] of Object.entries(attrs)) {
        if (k === "text") n.textContent = v;
        else if (k === "html") n.innerHTML = v;
        else n.setAttribute(k, v);
      }
      return n;
    };

    let state = { q: "", tag: "all" };

    function og(repo) { return `https://opengraph.githubassets.com/1/${repo}`; }

    function match(p) {
      const q = state.q.trim().toLowerCase();
      const inTag = state.tag === "all" || (p.tags || []).includes(state.tag);
      const inText = !q || (p.title + " " + (p.desc || "") + " " + (p.tags || []).join(" ")).toLowerCase().includes(q);
      return inTag && inText;
    }

    function card(p, i) {
      const a = el("a", "card snap-start shrink-0 md:shrink md:snap-none fade-up", {
        href: `https://github.com/${p.repo}`, target: "_blank", rel: "noopener",
        "aria-label": `Open repo: ${p.title}`,
        style: `transition-delay:${Math.min(i * 75, 525)}ms`
      });

      const media = el("div", "card-media");
      const img = el("img", "", { loading: "lazy", alt: `Preview of ${p.title} repository`, src: og(p.repo) });
      media.append(img);

      const arrow = el("div", "card-arrow", {
        html: '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>'
      });

      const info = el("div", "card-info");
      const h3 = el("h3", "card-title", { text: p.title });
      const d  = el("p", "card-desc", { text: p.desc || "" });
      const tagWrap = el("div", "card-tags");
      (p.tags || []).slice(0, 4).forEach(t => {
        tagWrap.appendChild(el("span", "card-tag", { text: t }));
      });
      info.append(h3, d, tagWrap);

      a.append(media, arrow, info);
      return a;
    }

    /* Shared observer — re-triggers fly-in on both scroll directions */
    const cardIO = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        const el = e.target;
        if (e.isIntersecting) {
          el.classList.add('in');
        } else {
          el.classList.remove('in');
          const rect = el.getBoundingClientRect();
          if (rect.bottom <= 0) el.dataset.dir = 'up';
          else if (rect.top >= window.innerHeight) el.dataset.dir = 'down';
        }
      });
    }, { threshold: 0.05, rootMargin: '0px 0px -30px 0px' });

    function render() {
      const root = document.getElementById("projects");
      root.innerHTML = "";
      const items = PROJECTS.filter(match);
      if (items.length === 0) {
        root.appendChild(el("div", "empty", { html: `<div class="font-mono text-xs uppercase tracking-widest mb-2">No matches</div><div>Try a different keyword or tag.</div>` }));
      } else {
        items.forEach((p, i) => root.appendChild(card(p, i)));
      }
      document.getElementById("count").textContent = `${items.length} project${items.length !== 1 ? "s" : ""} shown`;

      // hand the new cards to the observer
      root.querySelectorAll('.fade-up').forEach(c => cardIO.observe(c));
    }

    /* ---------- Interactions ---------- */
    const q = document.getElementById("q");
    q.addEventListener("input", () => { state.q = q.value; render(); });

    // ⌘K / Ctrl+K focuses search
    window.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault(); q.focus(); q.select();
      }
      if (e.key === 'Escape' && document.activeElement === q) q.blur();
    });

    document.querySelectorAll(".tag").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".tag").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.tag = btn.dataset.tag;
        render();
      });
    });

    /* ---------- Theme toggle ---------- */
    const themeBtn = document.getElementById('themeToggle');
    function setTheme(mode) {
      const dark = mode === 'dark';
      document.documentElement.classList.toggle('dark', dark);
      localStorage.setItem('theme', mode);
      themeBtn.setAttribute('aria-pressed', String(dark));
    }
    setTheme(document.documentElement.classList.contains('dark') ? 'dark' : 'light');

    themeBtn.addEventListener('click', () => {
      const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

      if (!document.startViewTransition || reduced) {
        setTheme(next);
        return;
      }

      const r = themeBtn.getBoundingClientRect();
      const x = r.left + r.width / 2;
      const y = r.top + r.height / 2;
      const endRadius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );

      const transition = document.startViewTransition(() => setTheme(next));
      transition.ready.then(() => {
        document.documentElement.animate(
          {
            clipPath: [
              `circle(0px at ${x}px ${y}px)`,
              `circle(${endRadius}px at ${x}px ${y}px)`
            ]
          },
          {
            duration: 620,
            easing: 'cubic-bezier(.2,.7,.2,1)',
            pseudoElement: '::view-transition-new(root)'
          }
        );
      });
    });

    // Initial render
    render();
  </script>
</body>
</html>
